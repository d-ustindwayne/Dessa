# Push a tag like v0.2.1 to build prebuilt Dessa for Windows, Linux and macOS
# and attach them to a GitHub release:
#     git tag v0.2.1 && git push origin v0.2.1
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04        # older glibc: the binary runs on more distributions
          - name: macos-arm64
            os: macos-latest

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit          # keeps Windows tools such as curl (the request tests use it)
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Set up g++ 13 (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 || true
          if command -v g++-13 > /dev/null; then echo "CXX=g++-13" >> "$GITHUB_ENV"; fi

      - name: Build
        run: |
          cmake -S . -B build ${{ matrix.os == 'windows-latest' && '-G Ninja' || '' }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          cmake --build build --target riv

      - name: Package
        run: python3 tools/make_release.py build dist

      - uses: actions/upload-artifact@v4
        with:
          name: dessa-${{ matrix.name }}
          path: dist/*

  web:
    name: web (dessa.js)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build web/dessa.js
        run: |
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j 4
          node tests/web/node_smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: dessa-web
          path: web/dessa.js

  vscode:
    # The VS Code extension as a .vsix, published to the Marketplace when the
    # repository has a VSCE_PAT secret
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package
        working-directory: tools/vscode-dessa
        run: npx --yes @vscode/vsce package -o "dessa-vscode-${GITHUB_REF_NAME#v}.vsix"
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: tools/vscode-dessa
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "No VSCE_PAT secret: skipping the Marketplace"; exit 0; fi
          npx --yes @vscode/vsce publish --packagePath dessa-vscode-*.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: dessa-vscode
          path: tools/vscode-dessa/*.vsix

  release:
    needs: [build, web, vscode]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  npm:
    # Publishes the npm package "dessalang" (the version in npm/package.json) when the repository has an NPM_TOKEN secret
    needs: web
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: dessa-web
          path: web
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "No NPM_TOKEN secret: skipping npm publish"; exit 0; fi
          cd npm
          npm publish --access public
