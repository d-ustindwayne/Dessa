# Builds the website (website/) and publishes it to GitHub Pages at
# https://dessa.dustindwayn.ee/ when anything it shows changes on main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "tests/bench/RESULTS.md"
      - "tests/bench/results.csv"
      - "tests/cases/run/**"
      - "README.md"
      - "npm/package.json"
      - "web/example/counter.dhtml"
      # the playground: the compiler, the runtime and the libraries' C
      - "src/**"
      - "runtime/**"
      - "include/**"
      - "tools/riv/packages/**"
      - "CMakeLists.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: The playground's compiler (dessa built for WebAssembly)
        working-directory: .
        run: |
          emcmake cmake -S . -B build-playground -DCMAKE_BUILD_TYPE=Release
          cmake --build build-playground -j 4
      # The runtime and libraries compiled for the playground (SQLite takes minutes)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/public/playground/objects
          key: playground-objects-${{ hashFiles('runtime/dessa_rt.*', 'runtime/dessa_web.*', 'include/**/*.c', 'tools/riv/packages/**/*.c', 'tools/riv/packages/**/*.h', 'tools/riv/packages/**/*.native', 'website/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist/website/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
