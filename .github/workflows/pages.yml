# Builds the website (website/) and publishes it to GitHub Pages at
# https://dessa.dustindwayn.ee/ when anything it shows changes on main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "tests/bench/RESULTS.md"
      - "tests/bench/results.csv"
      - "tests/cases/run/**"
      - "README.md"
      - "npm/package.json"
      - "web/example/counter.dhtml"
      # the playground: the compiler, the runtime and the libraries' C
      - "src/**"
      - "runtime/**"
      - "include/**"
      - "tools/riv/packages/**"
      - "CMakeLists.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
      - name: The playground's compiler (dessa built for WebAssembly)
        working-directory: .
        run: |
          emcmake cmake -S . -B build-playground -DCMAKE_BUILD_TYPE=Release
          cmake --build build-playground -j 4
      # The runtime and libraries compiled for the playground (SQLite takes minutes)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: website/public/playground/objects
          key: playground-objects-${{ hashFiles('runtime/dessa_rt.*', 'runtime/dessa_web.*', 'include/**/*.c', 'tools/riv/packages/**/*.c', 'tools/riv/packages/**/*.h', 'tools/riv/packages/**/*.native', 'website/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist/website/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
