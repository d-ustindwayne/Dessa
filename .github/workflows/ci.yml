# Builds Dessa and runs the test suite on Windows, Linux and macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs more than to read the code
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MinGW g++)
            os: windows-latest
          - name: Linux (g++)
            os: ubuntu-24.04
          - name: macOS (clang)
            os: macos-latest

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MinGW (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit          # keeps Windows tools such as curl (the request tests use it)
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Install GTK 3 and an invisible display (Linux, for ashwee)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-0t64 xvfb xauth

      - name: Build dessa
        run: |
          cmake -S . -B build ${{ matrix.os == 'windows-latest' && '-G Ninja' || '' }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Build riv
        run: cmake --build build --target riv

      - name: Test
        run: ${{ matrix.os == 'ubuntu-24.04' && 'xvfb-run -a ' || '' }}python3 tests/test.py

      - name: The Dessa lexer gives the same tokens as the C++ one (selfhost)
        if: matrix.os == 'ubuntu-24.04'
        run: python3 selfhost/check.py

      - name: Show the compiler logs if something failed
        if: failure()
        run: |
          python3 - <<'EOF' || true
          import glob, os, tempfile
          for log in glob.glob(os.path.join(os.path.expanduser("~/.cache") if os.name != "nt" else tempfile.gettempdir(), "dessa", "**", "*.log"), recursive=True)[:5]:
              print("=====", log)
              print(open(log, errors="replace").read()[-4000:])
          EOF

  wasm:
    # Programs and pages compiled to WebAssembly, with the compiler users get
    # from `dessa setup wasm` (wasi-sdk cut down by tools/make_wasm_tools.py)
    name: WebAssembly target (wasi-sdk, ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build dessa
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: The WebAssembly compiler, where `dessa setup wasm` puts it
        run: |
          python3 tools/make_wasm_tools.py ${{ matrix.platform }} -o /tmp/wasm-tools
          mkdir -p wasm
          tar -xzf /tmp/wasm-tools/dessa-wasm-${{ matrix.platform }}.tar.gz -C wasm
      - name: Test through WebAssembly
        run: python3 tests/test.py --wasm
      - name: A page as WebAssembly
        run: node tests/web/wasm_page.js
      - name: webutils in a real browser
        run: python3 tests/web/chrome_utils.py

      - name: Components in Chrome
        run: python3 tests/web/chrome_xds.py
      - name: The npm package (with this dessa)
        run: DESSALANG_DESSA="$PWD/build/dessa" node npm/test.js
      - name: Show the WebAssembly compiler's logs if something failed
        if: failure()
        run: for f in ~/.cache/dessa/objects/*.log ~/.cache/dessa/*.log; do [ -f "$f" ] && { echo "===== $f"; tail -c 4000 "$f"; }; done; true

  security:
    # The checks tests/test.py can't do in a normal build: see docs/security.md
    name: Memory checkers and fuzzing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dessa
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target dessa -j 4
      - name: The test programs, with AddressSanitizer and UndefinedBehaviorSanitizer
        run: python3 tests/sanitize.py
      - name: Damaged programs into the compiler
        run: python3 tests/fuzz.py --seconds 120 --seed ${{ github.run_number }}
      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failures
          path: tests/fuzz-failures/
          if-no-files-found: ignore
